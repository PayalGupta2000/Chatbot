<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #1d2939; --muted: #667085; --line: #e8e5df; --paper: #fffdf9; --canvas: #f5f3ee; --navy: #162f31; --teal: #1c7168; --teal-soft: #e1f1eb; --shadow: 0 18px 45px rgba(27, 46, 44, .10); }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; min-width: 320px; color: var(--ink); background: var(--canvas); font-family: "DM Sans", sans-serif; }
        button, textarea, select { font: inherit; }
        button { cursor: pointer; }
        .app { display: flex; min-height: 100vh; }
        .sidebar { display: flex; flex: 0 0 274px; flex-direction: column; color: #eaf4f1; background: var(--navy); position: sticky; top: 0; height: 100vh; }
        .sidebar-main { display: flex; flex: 1; flex-direction: column; min-height: 0; padding: 22px 16px 0; }
        .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
        .brand { display: flex; align-items: center; gap: 10px; padding: 3px 8px 23px; font-weight: 700; letter-spacing: -.02em; }
        .brand-mark { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; color: var(--navy); background: #c6e5d6; font-family: "Playfair Display", serif; font-size: 18px; }
        .new-chat { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px; border: 1px solid rgba(225,241,235,.22); border-radius: 9px; color: #f7fcfa; background: rgba(255,255,255,.08); transition: background .2s; font-size: 13px; }
        .new-chat:hover { background: rgba(255,255,255,.15); }
        .history-label { margin: 22px 8px 8px; color: #a9c0bb; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .clear-link { color: #8fc6b8; font-size: 10px; text-transform: none; letter-spacing: 0; cursor: pointer; opacity: .7; }
        .clear-link:hover { opacity: 1; }
        #history { }
        .history-item { display: flex; align-items: center; gap: 6px; width: 100%; padding: 10px 11px; border: 0; border-radius: 8px; color: #d5e2de; background: transparent; font-size: 13px; text-align: left; cursor: pointer; }
        .history-item:hover, .history-item.active { background: rgba(255,255,255,.1); }
        .history-item .h-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-item .h-del { display: none; padding: 0 2px; border: 0; color: #d5a9a9; background: transparent; font-size: 12px; line-height: 1; border-radius: 4px; }
        .history-item:hover .h-del { display: block; }
        .history-item .h-del:hover { color: #f5baba; }
        .history-empty { padding: 20px 11px; color: #78928b; font-size: 12px; text-align: center; font-style: italic; }
        .docs-label { margin: 16px 8px 8px; color: #a9c0bb; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .docs-label .doc-count { color: #78928b; font-size: 10px; font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: auto; margin-right: 8px; }
        .docs-label .upload-link { color: #8fc6b8; font-size: 11px; text-transform: none; letter-spacing: 0; cursor: pointer; }
        .docs-label .upload-link:hover { color: #b5dfd2; }
        #doc-list { }
        .doc-item { display: flex; align-items: center; gap: 8px; padding: 7px 11px; border-radius: 8px; color: #d5e2de; font-size: 13px; }
        .doc-item:hover { background: rgba(255,255,255,.08); }
        .doc-icon { flex: 0 0 20px; font-size: 15px; text-align: center; }
        .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doc-actions { display: none; gap: 4px; }
        .doc-item:hover .doc-actions { display: flex; }
        .doc-action { padding: 2px 6px; border: 0; border-radius: 4px; color: #bce0d6; background: rgba(255,255,255,.1); font-size: 10px; white-space: nowrap; }
        .doc-action:hover { background: rgba(255,255,255,.2); }
        .doc-remove { padding: 2px 5px; border: 0; border-radius: 4px; color: #d5a9a9; background: transparent; font-size: 13px; line-height: 1; }
        .doc-remove:hover { background: rgba(255,100,100,.15); }
        .doc-empty { padding: 10px 11px; color: #78928b; font-size: 12px; text-align: center; }
        .sidebar-foot { padding: 14px 8px 16px; border-top: 1px solid rgba(225,241,235,.12); color: #78928b; font-size: 11px; text-align: center; }
.sidebar-nav { margin: 8px 0; display: flex; flex-direction: column; gap: 2px; }
.nav-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 11px; border: 0; border-radius: 8px; color: #d5e2de; background: transparent; font-size: 13px; cursor: pointer; }
.nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,.1); }
.nav-btn .nav-icon { font-size: 15px; flex-shrink: 0; }
.plugins-view { display: none; flex: 1; flex-direction: column; padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 38px); overflow-y: auto; }
.plugins-view.active { display: flex; }
.chat-shell.hidden { display: none; }
.plugins-header { margin-bottom: 28px; }
.plugins-header h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; color: var(--ink); }
.plugins-header p { margin: 0; color: var(--muted); font-size: 14px; }
.plugin-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); transition: box-shadow .2s; }
.plugin-card:hover { box-shadow: var(--shadow); }
.plugin-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 10px; font-size: 20px; flex-shrink: 0; }
.plugin-icon.on { color: #1c7168; background: #e1f1eb; }
.plugin-icon.off { color: #667085; background: #f0efec; }
.plugin-info { flex: 1; min-width: 0; }
.plugin-info .plugin-name { font-weight: 600; font-size: 14px; color: var(--ink); }
.plugin-info .plugin-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.plugin-info .plugin-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.plugin-meta .hook-badge { padding: 1px 7px; border-radius: 999px; background: #eef5f2; color: #37635e; font-size: 10px; font-weight: 500; }
.plugin-meta .version-badge { padding: 1px 7px; border-radius: 999px; background: #f0efec; color: #667085; font-size: 10px; font-weight: 500; }
.plugin-toggle { flex-shrink: 0; }
.toggle-switch { position: relative; display: inline-block; width: 38px; height: 22px; cursor: pointer; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; border-radius: 22px; background: #d0d5dd; transition: background .2s; }
.toggle-slider::before { content: ""; position: absolute; left: 3px; bottom: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle-switch input:checked + .toggle-slider { background: #1c7168; }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }
.plugins-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.plugins-error { text-align: center; padding: 40px 20px; color: #d9534f; font-size: 14px; }
.plugins-loading { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.plugins-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 22px; border-radius: 10px; color: #fff; background: var(--navy); font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; box-shadow: var(--shadow); }
.plugins-toast.show { opacity: 1; }
        .workspace { display: flex; flex: 1; flex-direction: column; min-width: 0; }
        .topbar { display: flex; align-items: center; justify-content: space-between; height: 70px; padding: 0 clamp(22px, 5vw, 72px); border-bottom: 1px solid var(--line); background: rgba(255,253,249,.82); flex-shrink: 0; }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .toggle-sidebar { display: none; padding: 6px 8px; border: 1px solid #d7e4df; border-radius: 7px; color: #37635e; background: #fffdf9; font-size: 16px; line-height: 1; cursor: pointer; }
        .toggle-sidebar:hover { border-color: var(--teal); color: var(--teal); }
        .topbar h1 { margin: 0; font-size: 15px; font-weight: 600; }
        .topbar-actions { display: flex; align-items: center; gap: 12px; }
        .topbar-btn { padding: 6px 9px; border: 1px solid #d7e4df; border-radius: 7px; color: #37635e; background: #fffdf9; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .topbar-btn:hover { border-color: var(--teal); color: var(--teal); }
        .lang-select { padding: 5px 8px; border: 1px solid #d7e4df; border-radius: 7px; color: #37635e; background: #fffdf9; font-size: 12px; font-weight: 500; outline: none; cursor: pointer; }
        .lang-select:hover { border-color: var(--teal); }
        .share-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 22px; border-radius: 10px; color: #fff; background: var(--navy); font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; box-shadow: var(--shadow); }
        .share-toast.show { opacity: 1; }
        .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4bb090; box-shadow: 0 0 0 3px #dff3ea; transition: background .3s; }
        .status-dot.busy { background: #e8b84b; box-shadow: 0 0 0 3px #f7edcd; }
        .status-dot.error { background: #d9534f; box-shadow: 0 0 0 3px #f5d6d6; }
        .chat-shell { display: flex; flex: 1; flex-direction: column; width: min(100%, 920px); margin: 0 auto; padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 38px) 22px; min-height: 0; }
        #chat-box { display: flex; flex: 1; flex-direction: column; gap: 18px; overflow-y: auto; padding: 0 2px 28px; scroll-behavior: smooth; }
        #chat-box:empty { display: none; }
        .welcome { max-width: 620px; margin: auto auto 22px; text-align: center; }
        .welcome .eyebrow { margin: 0 0 10px; color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
        .welcome h2 { margin: 0; color: #213835; font-family: "Playfair Display", serif; font-size: clamp(31px, 4vw, 45px); font-weight: 600; letter-spacing: -.03em; }
        .welcome p { margin: 13px auto 24px; color: var(--muted); line-height: 1.6; }
        .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
        .suggestion { padding: 9px 13px; border: 1px solid #d7e4df; border-radius: 999px; color: #37635e; background: #fbfffd; font-size: 13px; transition: all .2s; }
        .suggestion:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
        .message-row { display: flex; gap: 10px; max-width: 86%; animation: rise .22s ease-out; }
        .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { display: grid; flex: 0 0 30px; width: 30px; height: 30px; place-items: center; border-radius: 50%; color: #fff; background: var(--teal); font-size: 11px; font-weight: 700; }
        .message-row.user .avatar { background: #667085; }
        .msg { padding: 12px 14px; border-radius: 4px 15px 15px; color: #263b3a; background: #fff; box-shadow: 0 2px 5px rgba(27,46,44,.04); line-height: 1.6; min-width: 0; }
        .message-row.user .msg { border-radius: 15px 4px 15px 15px; color: #fff; background: var(--navy); white-space: pre-wrap; }
        .message-row.ai .msg > :first-child { margin-top: 0; }
        .message-row.ai .msg > :last-child { margin-bottom: 0; }
        .message-row.ai .msg p { margin: 0 0 10px; }
        .message-row.ai .msg h1, .message-row.ai .msg h2, .message-row.ai .msg h3 { margin: 16px 0 7px; color: #183a36; line-height: 1.25; }
        .message-row.ai .msg h1 { font-size: 20px; } .message-row.ai .msg h2 { font-size: 17px; } .message-row.ai .msg h3 { font-size: 15px; }
        .message-row.ai .msg .reply-section { margin: 12px 0; padding: 12px 13px 2px; border: 1px solid #dbe9e3; border-left: 3px solid #5ca898; border-radius: 8px; background: #f7fbf9; }
        .message-row.ai .msg .reply-section h3 { margin: 0 0 6px; color: #17594f; font-size: 14px; }
        .message-row.ai .msg .reply-section ul, .message-row.ai .msg .reply-section ol { margin-top: 5px; }
        .message-row.ai .msg ul, .message-row.ai .msg ol { margin: 7px 0 11px; padding-left: 21px; }
        .message-row.ai .msg li + li { margin-top: 4px; }
        .message-row.ai .msg code { padding: 2px 5px; border-radius: 4px; color: #17594f; background: #e6f2ee; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
        .code-block-wrapper { position: relative; margin: 10px 0; }
        .code-block-wrapper pre { margin: 0; padding: 12px; border-radius: 8px; border: 1px solid var(--line); overflow-x: auto; }
        .code-block-wrapper pre code { padding: 0; }
        .code-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
        .code-block-wrapper:hover .code-actions { opacity: 1; }
        .code-copy-btn, .code-dl-btn { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: var(--paper); cursor: pointer; }
        .code-copy-btn:hover, .code-dl-btn:hover { color: var(--teal); border-color: var(--teal); }
        .message-row.ai .msg blockquote { margin: 10px 0; padding-left: 11px; border-left: 3px solid #8fc6b8; color: #586d6a; }
        .action-card { display: flex; gap: 10px; margin: 10px 0 4px; padding: 10px 13px; border: 1px solid #d1e2db; border-radius: 9px; background: #f4faf7; align-items: center; }
        .action-card-icon { font-size: 20px; flex-shrink: 0; }
        .action-card-body strong { display: block; margin-bottom: 4px; color: #17594f; font-size: 14px; }
        .action-card-details { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: #3e625b; }
        .action-card-details code { padding: 2px 6px; border-radius: 4px; background: #dff3ea; font-size: 12px; }
        .image-card { flex-direction: column; align-items: stretch; padding: 0; overflow: hidden; background: #fff; }
        .image-card-preview { position: relative; display: flex; align-items: center; justify-content: center; min-height: 160px; background: #f5f3ee; border-radius: 9px 9px 0 0; }
        .image-card-preview img { display: block; width: 100%; height: auto; max-height: 400px; object-fit: contain; border-radius: 9px 9px 0 0; }
        .image-card-fallback { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; background: #f5f3ee; border-radius: 9px 9px 0 0; }
        .image-card-fallback.show { display: flex; }
        .image-card-fallback a { color: var(--teal); text-decoration: underline; }
        .image-card .action-card-body { padding: 8px 14px 12px; text-align: center; }
        .image-card .action-card-body .btn { display: inline-block; padding: 5px 14px; border: 1px solid var(--teal); border-radius: 6px; color: var(--teal); font-size: 12px; font-weight: 600; text-decoration: none; transition: all .2s; }
        .image-card .action-card-body .btn:hover { color: #fff; background: var(--teal); }
        .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .badge.success { color: #1c6f4b; background: #d5f0e0; }
        .badge.error { color: #b53b3b; background: #fce5e5; }
        .message-actions { display: flex; align-items: center; margin-top: 7px; gap: 10px; }
        .copy-btn, .edit-btn { padding: 0; border: 0; color: var(--muted); background: transparent; font-size: 11px; }
        .copy-btn:hover, .edit-btn:hover { color: var(--teal); }
        .translate-select { padding: 0; border: 0; color: var(--muted); background: transparent; font-size: 11px; cursor: pointer; outline: none; }
        .translate-select:hover { color: var(--teal); }
        .translate-select option { color: var(--ink); }
        .typing { display: flex; gap: 4px; align-items: center; min-width: 66px; height: 38px; }
        .typing span { width: 7px; height: 7px; border-radius: 50%; background: #78a49b; animation: pulse 1s infinite alternate; }
        .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
        .composer { display: flex; align-items: flex-end; gap: 9px; padding: 9px 10px 9px 15px; border: 1px solid #d8ddd8; border-radius: 15px; background: var(--paper); box-shadow: var(--shadow); flex-shrink: 0; }
        .composer.dragover { border-color: var(--teal); background: var(--teal-soft); }
        #msg { display: block; flex: 1; min-height: 28px; max-height: 120px; padding: 4px 0; resize: none; border: 0; outline: 0; color: var(--ink); background: transparent; line-height: 1.45; }
        #msg::placeholder { color: #98a2b3; }
        .icon-button, .send-button { display: grid; width: 37px; height: 37px; place-items: center; border: 0; border-radius: 10px; flex-shrink: 0; }
        .icon-button { color: var(--muted); background: transparent; } .icon-button:hover, .icon-button.recording { color: var(--teal); background: var(--teal-soft); }
        .icon-button.recording { animation: recording 1s infinite alternate; }
        .send-button { color: #fff; background: var(--teal); } .send-button:hover { background: #145b54; } .send-button:disabled { cursor: not-allowed; opacity: .5; }
        .composer-note { margin: 10px 0 0; color: #98a2b3; font-size: 11px; text-align: center; flex-shrink: 0; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @keyframes pulse { to { opacity: .28; transform: translateY(-2px); } }
        @keyframes recording { to { box-shadow: 0 0 0 5px rgba(28,113,104,.15); } }
        @media (max-width: 720px) { .sidebar { display: none; } .topbar { height: 60px; } .chat-shell { min-height: calc(100vh - 60px); padding-top: 24px; } .message-row { max-width: 94%; } }
    </style>
</head>
<body>
    <main class="app">
        <aside class="sidebar" aria-label="Chat navigation">
            <div class="sidebar-main">
                <div class="brand"><span class="brand-mark">a</span> Acme Assistant</div>
                <button class="new-chat" id="new-chat" type="button"><span>＋</span> New conversation</button>
                <div class="sidebar-scroll">
                    <p class="history-label">Recent conversations <span class="clear-link" id="clear-all">Clear all</span></p>
                    <div id="history" aria-label="Conversation history"></div>
                    <p class="docs-label"><span>Documents</span><span class="doc-count" id="doc-count"></span><span class="upload-link" id="upload-link">+ Upload</span></p>
                    <div id="doc-list" aria-label="Uploaded documents"></div>
                </div>
            </div>
            <nav class="sidebar-nav" aria-label="Workspace navigation">
                <button class="nav-btn active" id="nav-chat" type="button"><span class="nav-icon">💬</span> Chat</button>
                <button class="nav-btn" id="nav-plugins" type="button"><span class="nav-icon">🧩</span> Plugins</button>
            </nav>
            <div class="sidebar-foot">Your conversations stay in this session.</div>
        </aside>
        <section class="workspace">
            <header class="topbar"><h1 id="topbar-title">AI Assistant</h1><div class="topbar-actions"><select class="lang-select" id="lang-select" aria-label="Select response language"><option value="">Auto</option><option value="English">English</option><option value="Spanish">Spanish</option><option value="French">French</option><option value="German">German</option><option value="Italian">Italian</option><option value="Portuguese">Portuguese</option><option value="Russian">Russian</option><option value="Japanese">Japanese</option><option value="Korean">Korean</option><option value="Chinese">Chinese</option><option value="Arabic">Arabic</option><option value="Hindi">Hindi</option></select><button class="topbar-btn" id="share-chat" type="button">Share</button><button class="topbar-btn" id="export-chat" type="button">Export</button><button class="topbar-btn" id="refresh-plugins" type="button" style="display:none">⟳ Refresh</button><div class="status"><span class="status-dot" id="status-dot"></span><span id="status-text">Ready</span></div></div></header>
            <div class="chat-shell" id="chat-shell">
                <div id="chat-box" aria-live="polite"></div>
                <form class="composer" id="chat-form">
                    <textarea id="msg" rows="1" placeholder="Message the assistant…" aria-label="Message the assistant"></textarea>
                    <button class="icon-button" id="upload-button" type="button" aria-label="Upload a document" title="Upload a document">📎</button>
                    <button class="icon-button" id="voice-button" type="button" aria-label="Use voice input" title="Use voice input">⌁</button>
                    <button class="send-button" id="send-button" type="submit" aria-label="Send message" title="Send message">↑</button>
                </form>
                <p class="composer-note">AI can make mistakes. Verify important information.</p>
            </div>
            <div class="plugins-view" id="plugins-view">
                <div class="plugins-header">
                    <h2>Plugins Workspace</h2>
                    <p>Manage your chatbot plugins — enable, disable, and monitor active extensions.</p>
                </div>
                <div id="plugins-list"></div>
            </div>
        </section>
    </main>
    <div class="share-toast" id="share-toast"></div>
    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.png,.jpg,.jpeg,.gif,.bmp,.webp" multiple style="display:none">
    <script src="/assets/chatbot/js/ai_chat.js"></script>
</body>
</html>
