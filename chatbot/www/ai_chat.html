<!DOCTYPE html>
<html>
<head>
    <title>AI Chat</title>

    <meta name="csrf-token" content="{{ csrf_token }}">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0b1220;
    color: white;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #0a0f1c;
    padding: 15px;
    overflow-y: auto;
}

.sidebar h3 {
    margin: 0 0 10px;
}

#history div {
    padding: 10px;
    margin: 6px 0;
    background: #111827;
    border-radius: 8px;
    cursor: pointer;
}

/* CHAT AREA */
.container {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    /* 👇 limit width */
    max-width: 900px;

    /* center feel */
    margin: 0 auto;
}

/* CHAT BOX */
#chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    border-radius: 12px;
    background: whitesmoke;
}

/* MESSAGE */
.msg {
    padding: 10px 12px;
    margin: 8px 0;
    border-radius: 10px;
    max-width: 75%;
    animation: fadeIn 0.2s ease-in;
}

.user {
    background: black;
    margin-left: auto;
}

.ai {
    background: #0a0f1c;
    margin-right: auto;
}

/* INPUT */
.input-box {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

#msg {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
}

button {
    padding: 12px 14px;
    border: none;
    background: black;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.copy-btn {
    float: right;
    font-size: 11px;
    background: #111827;
    border: 1px solid #374151;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity:0; transform: translateY(5px);}
    to {opacity:1; transform: translateY(0);}
}
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>💬 Chats</h3>
        <div id="history"></div>
    </div>

    <!-- CHAT -->
    <div class="container">

        <div id="chat-box"></div>

        <div class="input-box">
            <input id="msg" placeholder="Type message..." />
            <button onclick="startVoice()">🎤</button>
            <button onclick="sendMsg()">Send</button>
        </div>

    </div>

</div>

<script src="/assets/chatbot/js/ai_chat.js"></script>

</body>
</html>
